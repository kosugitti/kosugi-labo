name: Monitor Server Status

on:
  schedule:
    # 毎時0分に実行 (UTC)
    - cron: '0 * * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20  # 停止判定で直近のJSONを遡るため

      - name: Check server status update time
        id: check
        run: |
          # JSONファイルから更新時刻を取得
          UPDATED_AT=$(cat data/server_status.json | jq -r '.updated_at')
          echo "Last update: $UPDATED_AT"

          # 更新時刻をUnix timestampに変換
          UPDATED_TS=$(date -d "$UPDATED_AT" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%S" "${UPDATED_AT%+*}" +%s 2>/dev/null)
          NOW_TS=$(date +%s)

          # 差分を計算（秒）
          DIFF=$((NOW_TS - UPDATED_TS))
          DIFF_HOURS=$((DIFF / 3600))

          echo "Time since last update: $DIFF_HOURS hours ($DIFF seconds)"

          # 1時間（3600秒）以上古いかチェック
          if [ $DIFF -gt 3600 ]; then
            echo "stale=true" >> $GITHUB_OUTPUT
            echo "hours=$DIFF_HOURS" >> $GITHUB_OUTPUT
          else
            echo "stale=false" >> $GITHUB_OUTPUT
          fi

      - name: Create issue if stale
        if: steps.check.outputs.stale == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const hours = '${{ steps.check.outputs.hours }}';

            // 既存の同じタイトルのIssueがないかチェック
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'server-alert'
            });

            const existingIssue = issues.data.find(i =>
              i.title.includes('サーバーステータス更新停止')
            );

            if (existingIssue) {
              // 既存Issueにコメント追加
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `まだ更新が停止しています（${hours}時間経過）\n\n確認時刻: ${new Date().toISOString()}`
              });
            } else {
              // 新規Issue作成
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '⚠️ サーバーステータス更新停止アラート',
                body: `## 警告\n\nサーバーステータスの更新が **${hours}時間以上** 停止しています。\n\nAl-Khwarizumiに問題が発生している可能性があります。\n\n### 確認事項\n- [ ] Al-Khwarizumiは起動しているか\n- [ ] cronジョブは動作しているか (\`crontab -l\`)\n- [ ] ネットワーク接続は正常か\n\n---\n検出時刻: ${new Date().toISOString()}`,
                labels: ['server-alert']
              });
            }

      - name: Close alert issues if recovered
        if: steps.check.outputs.stale == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            // 更新が正常（stale=false）に戻ったので、開いている server-alert Issue を自動クローズ
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'server-alert'
            });

            const alertIssues = issues.data.filter(i =>
              i.title.includes('サーバーステータス更新停止')
            );

            for (const issue of alertIssues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `サーバーステータスの更新が正常に再開したため、自動クローズします。\n\n確認時刻: ${new Date().toISOString()}`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }

      # 個別マシンの停止検知(2026-09-24追加)。Taniyamaが9/13から約10日止まっていたのに
      # JSONに offline と書かれるだけで通知が無かったため。直近3回の更新(約30分)で
      # 続けて offline のときだけ警報する。Gauss は常に offline 表示なので対象外
      - name: Check offline servers
        id: offline
        if: steps.check.outputs.stale == 'false'
        run: |
          WATCH="Al-Khwarizumi Shimura Taniyama Seki Yamabe"
          COMMITS=$(git log -3 --format=%H -- data/server_status.json)
          DOWN=""
          for n in $WATCH; do
            cnt=0
            for c in $COMMITS; do
              st=$(git show "$c:data/server_status.json" | jq -r --arg n "$n" '.servers[] | select(.name==$n) | .status')
              [ "$st" = "offline" ] && cnt=$((cnt+1))
            done
            [ "$cnt" -eq 3 ] && DOWN="$DOWN $n"
          done
          echo "down=$(echo $DOWN)" >> $GITHUB_OUTPUT
          echo "watch=$WATCH" >> $GITHUB_OUTPUT
          echo "Down: $DOWN"

      - name: Open or close per-server alerts
        if: steps.check.outputs.stale == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const down = '${{ steps.offline.outputs.down }}'.split(' ').filter(x => x);
            const watch = '${{ steps.offline.outputs.watch }}'.split(' ').filter(x => x);
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'server-alert'
            });
            const now = new Date().toISOString();
            for (const name of watch) {
              const title = `サーバ停止アラート: ${name}`;
              const open = issues.data.find(i => i.title === title);
              if (down.includes(name) && !open) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: title,
                  body: `## 警告\n\n**${name}** が直近3回の監視(約30分)で続けて offline です。\n\n### 確認事項\n- [ ] Tailscale で ping が返るか\n- [ ] SSH のバナーが返るか(返らなければ固まっている)\n- [ ] 現地で電源の入れ直しが要るか\n- [ ] 復帰後に前回起動のログ(journalctl -b -1)と /var/log/health-log.txt を確認\n\n---\n検出時刻: ${now}`,
                  labels: ['server-alert']
                });
              } else if (!down.includes(name) && open) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: open.number,
                  body: `${name} が online に戻ったため自動クローズします。\n\n確認時刻: ${now}`
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: open.number,
                  state: 'closed'
                });
              }
            }
